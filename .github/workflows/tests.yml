name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23", "1.24", "1.25"]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify pinned specification
        run: |
          test "$(git -C tests/spec rev-parse HEAD)" = "62f16b369408180f1faf1cba7da1b46d1f336f12"
          test "$(git -C tests/spec describe --tags --exact-match)" = "v4.1.1"

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -count=1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic

      - name: View coverage
        run: go tool cover -func=coverage.out

      - name: Require implementation coverage
        run: |
          go tool cover -func=coverage.out | awk '/^total:/ { found=1; if ($3 == "0.0%") exit 1 } END { if (!found) exit 1 }'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.go-version }}
          path: coverage.out

  conformance:
    name: Pinned fixture suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify pinned specification
        run: |
          test "$(git -C tests/spec rev-parse HEAD)" = "62f16b369408180f1faf1cba7da1b46d1f336f12"
          test "$(git -C tests/spec describe --tags --exact-match)" = "v4.1.1"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run complete fixture suite
        run: go test ./tests -run '^TestSpec(Encode|Decode)Fixtures$' -count=1

  quality:
    name: Vet, format, and race
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify pinned specification
        run: |
          test "$(git -C tests/spec rev-parse HEAD)" = "62f16b369408180f1faf1cba7da1b46d1f336f12"
          test "$(git -C tests/spec describe --tags --exact-match)" = "v4.1.1"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Run vet
        run: go vet ./...

      - name: Run race tests
        run: go test -race ./... -count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify pinned specification
        run: |
          test "$(git -C tests/spec rev-parse HEAD)" = "62f16b369408180f1faf1cba7da1b46d1f336f12"
          test "$(git -C tests/spec describe --tags --exact-match)" = "v4.1.1"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
